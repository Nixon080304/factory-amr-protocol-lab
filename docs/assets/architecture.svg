<g font-size="18" text-anchor="middle"><text x="135" y="121">Mission publisher</text><text x="135" y="147">Mosquitto / MQTT</text><text x="395" y="133">mqtt_gateway</text><text x="687" y="122">mission_coordinator</text><text x="687" y="147">C++ / phase gates</text><text x="970" y="122">modbus_gateway</text><text x="970" y="147">TransferPart service</text>
