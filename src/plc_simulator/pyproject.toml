[build-system]
requires = ["setuptools>=64", "packaging>=26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "plc-simulator"
version = "0.1.0"
description = "Standalone Modbus PLC simulator for assembly and inspection stations."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Nixon Edward Winata", email = "nixonedwardwinata2004@gmail.com"}]
dependencies = ["pymodbus==3.15.0"]

[project.scripts]
plc-simulator = "plc_simulator.server:main"

[tool.setuptools.packages.find]
include = ["plc_simulator*"]
