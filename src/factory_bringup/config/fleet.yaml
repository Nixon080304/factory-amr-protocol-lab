# Add each robot here; all fleet consumers iterate over this configuration.
# Poses are [x, y, yaw] in world coordinates. Each prefixed map uses this same origin.
robots:
  - robot_id: amr_01
    namespace: /amr_01
    frame_prefix: amr_01/
    spawn: [0.0, -3.0, 0.0]
    battery_start_percent: 100.0
  - robot_id: amr_02
    namespace: /amr_02
    frame_prefix: amr_02/
    spawn: [1.0, -3.0, 0.0]
    battery_start_percent: 60.0

resources:
  - resource_id: assembly
    kind: station
    capacity: 1
  - resource_id: inspection
    kind: station
    capacity: 1
  - resource_id: central_aisle
    kind: traffic_zone
    capacity: 1
  - resource_id: dock_01
    kind: dock
    capacity: 1

routes:
  to_assembly: [central_aisle, assembly]
  assembly_to_inspection: [assembly, central_aisle, inspection]
  inspection_to_assembly: [inspection, central_aisle, assembly]

# Every traffic leg starts and ends outside the capacity-one aisle.
# Arrival requires both Nav2 success and current robot localization at the exit.
traffic_bounds:
  central_aisle: [-0.8, -2.65, 0.8, -1.75]

route_segments:
  to_assembly:
    - resource_id: central_aisle
      staging_pose: [0.0, -3.5, 1.5707963267948966]
      exit_pose: [-1.5, -2.2, 3.141592653589793]
  assembly_to_inspection:
    - resource_id: central_aisle
      staging_pose: [-1.5, -2.2, 0.0]
      exit_pose: [1.5, -2.2, 0.0]
  inspection_to_assembly:
    - resource_id: central_aisle
      staging_pose: [1.5, -2.2, 3.141592653589793]
      exit_pose: [-1.5, -2.2, 3.141592653589793]

docks:
  dock_01:
    staging_pose: [3.5, -2.0, 0.0]
    charging_pose: [4.0, -2.0, 0.0]

energy:
  reserve_percent: 20.0
  charge_below_percent: 30.0
  charge_until_percent: 80.0
  dock_id: dock_01
  # Simulation percentages, not measured hardware discharge characteristics.
  idle_percent_per_sec: 0.001
  move_percent_per_m: 0.1
  operation_percent: 0.5
  charge_percent_per_sec: 1.0
  dock_allowance_m: 10.0
